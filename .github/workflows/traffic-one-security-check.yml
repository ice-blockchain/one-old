name: Traffic One security check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    name: Pre-deployment security scanner
    runs-on: ubuntu-latest
    # Without this the job inherits GitHub's 6-hour default. Nothing here is
    # slow (npm ci, gen+build, two small downloads, one full-history scan — a
    # few minutes), so a run that reaches this ceiling is hung, not busy: a
    # `curl` stalled on a half-open connection, or a scanner walking a repo that
    # grew unexpectedly. A hang ceiling, not a budget.
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate plugin dist
        run: npm run plugin:build

      # Both downloads pull a pinned release asset from GitHub Releases, which
      # is a third-party availability dependency on every push: a single 5xx or
      # reset connection failed this job for a reason that has nothing to do
      # with the code under review, and a job that cries wolf gets ignored
      # exactly when it is right. `-f` alone retries nothing, so the retry flags
      # are what make the failure mean something.
      #
      # --retry-all-errors is needed as well as --retry: without it curl retries
      # only transient HTTP 5xx/408/429, and the common CI failure here is a
      # connection reset or DNS blip, which is not an HTTP status at all.
      # --connect-timeout/--max-time bound each attempt so a half-open
      # connection cannot sit until the job timeout above.
      #
      # Checksums from the same GitHub release assets these URLs fetch
      # (gitleaks_8.30.1_checksums.txt / trufflehog_3.94.3_checksums.txt).
      # `sha256sum -c` proves transfer integrity of the pinned tarball; it is
      # not upstream provenance (that still needs a signature or a vendored
      # binary).
      - name: Install gitleaks v8.30.1
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 15 --max-time 180 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          mkdir -p /tmp/gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks gitleaks
          sudo install /tmp/gitleaks/gitleaks /usr/local/bin/gitleaks

      - name: Install trufflehog v3.94.3
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 15 --max-time 180 \
            https://github.com/trufflesecurity/trufflehog/releases/download/v3.94.3/trufflehog_3.94.3_linux_amd64.tar.gz \
            -o /tmp/trufflehog.tar.gz
          echo '7cc45010bfac7258a23731bc3ab4371abdbf20ffc705075066971e5aa8ebda7f  /tmp/trufflehog.tar.gz' | sha256sum -c -
          mkdir -p /tmp/trufflehog
          tar -xzf /tmp/trufflehog.tar.gz -C /tmp/trufflehog trufflehog
          sudo install /tmp/trufflehog/trufflehog /usr/local/bin/trufflehog

      - name: Run Traffic One security check
        run: node dist/scripts/security-check-runner.cjs --strict --no-stamp
