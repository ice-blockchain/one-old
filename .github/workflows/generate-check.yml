name: Generate check

# Verifies the TypeScript engine typechecks, dist generation is deterministic,
# the full test suite (incl. the byte-identical golden snapshot) is green, and
# the compiled runtime dispatches under bare node.

on:
  push:
  pull_request:

jobs:
  generate-check:
    name: Typecheck + gen --check + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Generate plugin content
        run: npm run gen

      - name: Build plugin runtime
        run: npm run build

      - name: Generated dist content in sync
        run: npm run gen -- --check

      - name: Tests (unit + golden snapshot)
        run: npm test

      - name: Compiled-runtime smoke (bare-node dispatch)
        run: npm run smoke

      - name: dist/scripts is the deterministic build output (no drift)
        run: npm run build:verify
