name: Cursor sync

on:
  push:
  pull_request:

jobs:
  check:
    name: Check generated Cursor artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cursor sync
        run: python3 scripts/sync-cursor.py --check

      - name: Check stack recommendation hooks
        run: python3 scripts/test-stack-recommendations.py
