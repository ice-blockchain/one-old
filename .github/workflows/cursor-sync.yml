name: Cursor sync

on:
  push:
  pull_request:

jobs:
  check:
    name: Check generated Cursor artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cursor sync
        run: node scripts/sync-cursor.cjs --check

      - name: Check stack recommendation hooks
        run: node scripts/test-stack-recommendations.cjs

      - name: Check security runner fixtures
        run: node scripts/test-security-check-runner.cjs
