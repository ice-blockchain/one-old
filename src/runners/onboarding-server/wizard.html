    /* Exact traffic.io design tokens (light "cream" surface, blue accent). */
    :root {
      --bg: #f7f6f2; --bg-2: #efece4; --card: #fbfaf6;
      --ink: #160715; --ink-2: #2a2b30; --muted: #5e5f64; --muted-2: #9b9ca2;
      --line: #e3e1d8; --line-2: #d6d3c8;
      --accent: #1668ed; --accent-strong: #125ed4; --accent-2: #6366f1; --accent-soft: #eef0ff;
      --ok: #0e7032; --warn: #c2660a; --danger: #dc2626;
      --chip-bg: #fbfaf6; --chip-border: #d6d3c8; --chip-ink: #6b6c72;
      --shadow-soft: 0 1px 2px #0c0d100f, 0 8px 24px #0c0d1008;
      --shadow-strong: 0 18px 50px #0c0d1026;
      --radius: 14px; --radius-sm: 10px;
      --font: 'Geist', 'Inter Tight', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background:
        radial-gradient(900px 540px at 92% -8%, rgba(38,125,255,.07), transparent 60%),
        radial-gradient(760px 460px at 4% 0%, rgba(99,102,241,.05), transparent 58%),
        var(--bg);
      color: var(--ink);
      font: 15px/1.55 var(--font);
      -webkit-font-smoothing: antialiased;
      display: flex; align-items: center; justify-content: center; padding: 28px;
    }
    .card {
      width: 100%; max-width: 680px;
      max-height: min(92vh, 800px);
      display: flex; flex-direction: column;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-strong);
      overflow: hidden;
    }

    /* ── Header / brand ─────────────────────────────── */
    .head { flex: none; padding: 17px 24px 15px; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 12px; }
    .logo { width: 34px; height: 28px; flex: none; }
    .brand-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .brand { font-weight: 640; letter-spacing: -.2px; font-size: 16px; color: var(--ink); }
    .sub { color: var(--muted); font-size: 12.5px; }

    /* ── Scrollable step body ───────────────────────── */
    .body { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 20px 24px 12px; }
    .body::-webkit-scrollbar { width: 9px; }
    .body::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 9px; border: 2px solid var(--card); }
    .body::-webkit-scrollbar-thumb:hover { background: #c7c3b6; }

    .step-head { margin-bottom: 16px; }
    .step-title { font-size: 19px; font-weight: 640; letter-spacing: -.3px; margin: 0 0 5px; color: var(--ink); }
    .step-desc { color: var(--muted); margin: 0; font-size: 13.5px; }
    .pill { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .02em;
      color: var(--accent); background: var(--accent-soft); border: 1px solid #d7defb;
      border-radius: 999px; padding: 2px 9px; margin-left: 8px; vertical-align: 2px; }

    /* ── Single-select option cards ─────────────────── */
    .opts { display: grid; gap: 10px; }
    .opt { display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer;
      padding: 14px 15px; border-radius: var(--radius-sm); background: var(--card);
      border: 1px solid var(--line); color: var(--ink); width: 100%;
      box-shadow: var(--shadow-soft);
      transition: border-color .14s ease, background .14s ease, box-shadow .14s ease, transform .05s ease; }
    .opt:hover { border-color: var(--accent); background: var(--accent-soft); }
    .opt:active { transform: translateY(1px); }
    .opt:focus-visible, .btn:focus-visible, .ctx-sum:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .opt-main { flex: 1 1 auto; min-width: 0; }
    .opt .label { font-weight: 600; }
    .opt .hint { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .opt-go { flex: none; color: var(--muted-2); font-size: 17px; transition: color .14s ease, transform .14s ease; }
    .opt:hover .opt-go { color: var(--accent); transform: translateX(3px); }

    /* ── Team line-up (team-confirmation step) ──────── */
    .team { margin: 2px 0 16px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); box-shadow: var(--shadow-soft); }
    .team-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
      padding: 11px 14px; border-bottom: 1px solid var(--line); background: var(--bg-2); }
    .team-head .t { font-weight: 600; font-size: 13px; color: var(--ink); }
    .team-head .lvl { font-size: 11.5px; color: var(--muted); }
    .member { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--line); }
    .member:first-of-type { border-top: 0; }
    .member .ic { width: 27px; height: 27px; flex: none; border-radius: 8px; background: var(--accent-soft);
      color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12.5px; }
    .member .who { flex: 1 1 auto; min-width: 0; }
    .member .who .name { font-weight: 600; font-size: 13.5px; color: var(--ink); }
    .member .who .blurb { color: var(--muted); font-size: 12px; margin-top: 1px; }
    .member .model { flex: none; display: flex; align-items: center; gap: 7px; }
    .tier-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
    .tier-highest { background: var(--accent); }
    .tier-balanced { background: var(--accent-2); }
    .tier-cheapest { background: var(--muted-2); }
    .chip { font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--chip-bg);
      border: 1px solid var(--chip-border); border-radius: 999px; padding: 3px 10px; font-family: var(--mono); }
    .member .model select { font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--chip-bg);
      border: 1px solid var(--chip-border); border-radius: 999px; padding: 3px 26px 3px 10px; font-family: var(--mono);
      cursor: pointer; appearance: none; -webkit-appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
    .member .model select:hover { border-color: var(--accent); }
    .team-foot { padding: 9px 14px; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); background: var(--bg-2); }
    .cursor-models-note { margin-top: 7px; padding-top: 7px; border-top: 1px dashed var(--line); color: var(--ink-2); }

    /* ── Performance repick context ─────────────────── */
    .repick-note { margin: 2px 0 16px; padding: 10px 14px; color: var(--ink-2); background: var(--accent-soft);
      border: 1px solid #d7defb; border-radius: 12px; font-size: 12.5px; }

    /* ── Project-context form ───────────────────────── */
    .ctx { margin: 0 0 16px; border: 1px solid #d7defb; border-radius: var(--radius-sm);
      background: var(--accent-soft); overflow: hidden; }
    .ctx-sum { cursor: pointer; list-style: none; padding: 10px 12px; font-size: 12.5px; font-weight: 600;
      color: var(--accent); display: flex; align-items: center; gap: 8px; user-select: none; }
    .ctx-sum::-webkit-details-marker { display: none; }
    .ctx-sum::before { content: "▸"; font-size: 11px; transition: transform .15s ease; }
    .ctx[open] .ctx-sum::before { transform: rotate(90deg); }
    .ctx-count { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--muted);
      background: #ffffffb0; border: 1px solid #d7defb; border-radius: 999px; padding: 1px 9px; }
    .ctx .domain { margin: 0 12px 10px; }
    .ctx[open] .domain:first-of-type { margin-top: 2px; }
    .domain { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-sm);
      padding: 10px 12px; color: var(--muted); font-size: 13px; margin: 0 0 14px; }
    .group { margin-top: 18px; }
    .group:first-of-type { margin-top: 8px; }
    .group-cap { font-size: 11px; letter-spacing: .13em; text-transform: uppercase; color: var(--muted-2);
      margin: 0 0 11px; display: flex; align-items: center; gap: 10px; }
    .group-cap::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(205px, 1fr)); gap: 11px 12px; }

    label.field { display: block; margin: 0; }
    label.field.lead { margin-bottom: 6px; }
    label.field .name { font-size: 12.5px; font-weight: 600; color: var(--ink); margin-bottom: 5px; display: block; }
    label.field.lead .name { font-size: 13px; }
    textarea, input[type=text] {
      width: 100%; background: #fff; border: 1px solid var(--line-2); color: var(--ink);
      border-radius: 10px; padding: 9px 11px; font: inherit; resize: vertical; transition: border-color .12s ease, box-shadow .12s ease; }
    textarea { min-height: 40px; line-height: 1.45; }
    label.field.lead input { padding: 11px 13px; font-size: 14.5px; }
    textarea::placeholder, input::placeholder { color: var(--muted-2); }
    textarea:focus, input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(22,104,237,.14); }

    /* ── Pinned action bar (progress + primary action) ─ */
    .actions { flex: none; padding: 14px 24px 16px; border-top: 1px solid var(--line); background: var(--card); }
    .actions.hidden { display: none; }
    .progress { display: flex; gap: 6px; }
    .pip { height: 4px; flex: 1; border-radius: 4px; background: var(--line); transition: background .2s ease; }
    .pip.done { background: var(--accent); }
    .pip.active { background: var(--accent); box-shadow: 0 0 0 3px rgba(22,104,237,.14); }
    .bar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 11px; }
    .stepcount { color: var(--muted); font-size: 12px; }
    .btn { cursor: pointer; padding: 11px 20px; border-radius: 10px; border: 1px solid var(--accent-strong);
      background: var(--accent); color: #fff; font: inherit; font-weight: 600; letter-spacing: .1px;
      box-shadow: 0 1px 2px #0c0d1014; transition: background .14s ease, transform .05s ease, box-shadow .14s ease; }
    .btn:hover { background: var(--accent-strong); box-shadow: 0 6px 18px rgba(22,104,237,.24); }
    .btn:active { transform: translateY(1px); }
    .btn[disabled] { opacity: .5; cursor: default; box-shadow: none; }

    /* ── Transient states ───────────────────────────── */
    .loading { display: flex; align-items: center; gap: 12px; color: var(--muted); padding: 10px 0; }
    .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Install progress (toolchain setup) ─────────── */
    .install-bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; margin-top: 20px; }
    .install-fill { height: 100%; width: 0%; border-radius: 999px; position: relative; overflow: hidden;
      background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .45s ease; }
    .install-fill::after { content: ""; position: absolute; inset: 0;
      background: linear-gradient(110deg, transparent 20%, rgba(255,255,255,.4) 50%, transparent 80%);
      animation: install-shine 1.8s linear infinite; }
    @keyframes install-shine { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
    .install-meta { display: flex; justify-content: space-between; margin-top: 8px;
      font-size: 12px; color: var(--muted); font-family: var(--mono); }
    .install-steps { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
    .install-step { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted-2); }
    .install-step .ic { width: 18px; height: 18px; flex: none; display: inline-flex; align-items: center;
      justify-content: center; border-radius: 50%; font-size: 11px; font-weight: 700;
      border: 1.5px solid var(--line-2); color: transparent; }
    .install-step.running { color: var(--ink); font-weight: 600; }
    .install-step.running .ic { border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
    .install-step.done { color: var(--ink-2); }
    .install-step.done .ic { background: #dff3e6; border-color: #dff3e6; color: var(--ok); }
    .install-step.warn { color: var(--ink-2); }
    .install-step.warn .ic { background: #fbeedd; border-color: #fbeedd; color: var(--warn); }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
    }
    .done-state { text-align: center; padding: 22px 0 10px; }
    .done-state .check { width: 50px; height: 50px; border-radius: 50%; background: #dff3e6; color: var(--ok);
      display: inline-flex; align-items: center; justify-content: center; font-size: 26px; margin-bottom: 12px; }
    .err { color: var(--danger); margin-top: 12px; font-size: 13px; }

    .foot { flex: none; color: var(--muted-2); font-size: 11.5px; padding: 12px 24px; border-top: 1px solid var(--line);
      display: flex; align-items: center; gap: 7px; }
    .foot .lock { color: var(--ok); }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="head">
      <svg class="logo" viewBox="0 0 944 784" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 391.775C0 359.839 25.8895 333.949 57.8257 333.949H443.813C475.749 333.949 501.638 359.839 501.638 391.775C501.638 423.711 475.749 449.601 443.812 449.601H57.8257C25.8894 449.601 0 423.711 0 391.775Z" fill="#160715"></path>
        <path d="M72.2734 590.545C72.2734 558.209 98.4865 531.996 130.822 531.996H369.353C401.689 531.996 427.902 558.209 427.902 590.545C427.902 622.88 401.689 649.093 369.353 649.093H130.822C98.4866 649.093 72.2734 622.88 72.2734 590.545Z" fill="#160715"></path>
        <path d="M112.766 192.994C112.766 160.658 138.979 134.445 171.314 134.445H330.335C362.67 134.445 388.883 160.658 388.883 192.994C388.883 225.329 362.67 251.542 330.335 251.542H171.314C138.979 251.542 112.766 225.329 112.766 192.994Z" fill="#160715"></path>
        <path d="M785.373 6.034C906.476 -27.9037 974.755 87.629 930.404 194.711L704.628 723.207C683.997 773.016 626.817 796.702 576.914 776.11C527.013 755.518 503.284 698.447 523.913 648.638L691.848 275.738C704.824 246.925 675.666 217.179 646.599 229.578L590.567 253.48C531.952 280.014 472.719 229.414 472.719 179.432C472.719 125.533 518.377 89.3398 560.951 75.1472L785.373 6.034Z" fill="#267DFF"></path>
      </svg>
      <div class="brand-text">
        <div class="brand">Traffic One</div>
        <div class="sub">Configure this workspace — answers stay on your machine.</div>
      </div>
    </div>
    <div class="body" id="view"><div class="loading"><span class="spinner"></span> Loading setup…</div></div>
    <div class="actions hidden" id="actions"></div>
    <div class="foot"><span class="lock">●</span> Runs locally on 127.0.0.1 — closes automatically when setup finishes.</div>
  </main>

  <script>
    // The server substitutes %%T1_TOKEN%% with the session token; fall back to the
    // URL query if it was somehow served unsubstituted.
    var T1_INJECTED = "%%T1_TOKEN%%";
    var T1_TOKEN = (T1_INJECTED.charAt(0) !== "%" ? T1_INJECTED : "")
      || new URLSearchParams(location.search).get("t") || "";
    const NEW_PROJECT_STEPS = ["api-key", "open-code", "performance", "team-confirmation", "project-context", "mobile", "code-graph"];
    const EXISTING_STEPS = ["api-key", "tech-detect", "open-code", "performance", "team-confirmation", "code-graph"];
    // Presentation-only grouping for the long project-context form so the fields
    // read as a few scannable sections instead of one tall stack. Unknown keys
    // (e.g. a field added server-side later) fall through to "More details".
    const FIELD_GROUPS = [
      { cap: "The basics", keys: ["audience", "coreFlows", "v1Features"] },
      { cap: "Product & access", keys: ["rolesAuth", "businessModel", "payments", "admin"] },
      { cap: "Data & integrations", keys: ["dataModel", "contentSource", "integrations"] },
      { cap: "Growth & constraints", keys: ["engagement", "successMetrics", "constraints", "domainSpecific"] },
    ];
    const view = document.getElementById("view");
    const actions = document.getElementById("actions");
    // Per-role exact model picks on the team step. Each selector is restricted
    // to the member's resolved tier; "Start the build" persists the complete
    // role → model map so a non-preferred row entry is not lost at runtime.
    let teamSelections = {};
    let teamDefaults = {};
    let completionStarted = false;

    async function api(path, opts = {}) {
      const headers = Object.assign({ "x-t1-token": T1_TOKEN }, opts.headers || {});
      if (opts.body) headers["content-type"] = "application/json";
      // A network-level failure (fetch itself rejects) usually means the setup
      // server died and was respawned on a NEW port+token — this tab can never
      // reach it again. Retry once for a transient blip, then tag the error so
      // callers can show the "server restarted" guidance instead of a generic one.
      let res;
      try {
        res = await fetch(path, Object.assign({}, opts, { headers }));
      } catch (_) {
        await new Promise((r) => setTimeout(r, 1000));
        try {
          res = await fetch(path, Object.assign({}, opts, { headers }));
        } catch (_) {
          const gone = new Error("The setup server is not responding.");
          gone.serverGone = true;
          throw gone;
        }
      }
      const text = await res.text();
      let json = null;
      try { json = text ? JSON.parse(text) : null; } catch (_) {}
      if (!res.ok) throw new Error((json && json.error) || ("HTTP " + res.status));
      return json;
    }

    function el(tag, attrs, children) {
      const node = document.createElement(tag);
      Object.assign(node, attrs || {});
      // Skip nullish children: a server payload missing an optional field must
      // degrade to an empty element, never kill the whole page via appendChild.
      (children || []).forEach((c) => { if (c == null) return; node.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
      return node;
    }

    function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

    function setActions(node) {
      actions.innerHTML = "";
      if (node) { actions.appendChild(node); actions.classList.remove("hidden"); }
      else { actions.classList.add("hidden"); }
    }

    function stepInfo(v) {
      const steps = v.mode === "new-project" ? NEW_PROJECT_STEPS : EXISTING_STEPS;
      return { steps, idx: steps.indexOf(v.step) };
    }

    function progress(v) {
      const { steps, idx } = stepInfo(v);
      const row = el("div", { className: "progress" });
      steps.forEach((_, i) => {
        const cls = idx === -1 || i < idx ? "pip done" : i === idx ? "pip active" : "pip";
        row.appendChild(el("div", { className: cls }));
      });
      return row;
    }

    // Sticky bottom bar: progress pips + a "Step X of Y" caption and, on forms, the
    // primary button — so the call to action is always visible while fields scroll.
    function actionBar(v, button) {
      const wrap = el("div", {});
      wrap.appendChild(progress(v));
      const row = el("div", { className: "bar-row" });
      const { steps, idx } = stepInfo(v);
      row.appendChild(el("div", { className: "stepcount" }, [idx >= 0 ? "Step " + (idx + 1) + " of " + steps.length : ""]));
      if (button) row.appendChild(button); else row.appendChild(el("div", {}));
      wrap.appendChild(row);
      return wrap;
    }

    function showLoading(text) {
      setActions(null);
      view.innerHTML = "";
      view.appendChild(el("div", { className: "loading" }, [el("span", { className: "spinner" }), text || "Working…"]));
    }

    function showError(message) {
      view.appendChild(el("div", { className: "err" }, [message || "Something went wrong."]));
    }

    // The old tab cannot rejoin a respawned server (new port + new token) — send
    // the user back to the editor, where the waiter announces the fresh link.
    function renderServerLost() {
      setActions(null);
      view.innerHTML = "";
      view.appendChild(el("div", { className: "step-title" }, ["Setup server restarted"]));
      view.appendChild(el("p", { className: "step-desc" }, [
        "This tab is no longer connected. Return to your editor and open the fresh setup link shown there — answers you already submitted are saved.",
      ]));
    }

    async function submitAnswer(step, value, loadingText) {
      showLoading(loadingText || "Saving…");
      let resp;
      try {
        resp = await api("/answer", { method: "POST", body: JSON.stringify({ step, value }) });
      } catch (err) {
        if (err && err.serverGone) return renderServerLost();
        return render({ error: err.message });
      }
      if (resp && resp.taskId) {
        const task = await pollTask(resp.taskId);
        if (task.status === "error" || task.status === "timeout") {
          // A required dependency (the code-graph tool) failed to install — gate
          // here so setup never reports complete with a broken provider.
          return renderInstallBlocked(step, value, task);
        }
      }
      render(resp.view);
    }

    async function pollTask(id) {
      installView = null;
      renderInstallProgress(null);
      // Liveness-keyed deadline instead of a fixed cap: every runner phase is
      // internally time-bounded well under this window (npm 180s, runtime
      // download / warm-up / scan ≤ 5 min each), so a healthy install always
      // changes the snapshot — or finishes — in time; only a wedged install
      // (or a dead runner) trips the wall. A fixed 5-minute cap used to fire
      // spuriously while a slow first-time install was still working.
      var lastChange = Date.now();
      var lastSig = "";
      while (Date.now() - lastChange < 360000) {
        let t;
        try { t = await api("/task/" + id); } catch (_) { return { status: "error", error: "Lost contact with the setup server during install." }; }
        if (t.status === "done" || t.status === "error") return t;
        var sig = JSON.stringify(t.progress || null);
        if (sig !== lastSig) { lastSig = sig; lastChange = Date.now(); }
        renderInstallProgress(t);
        await new Promise((r) => setTimeout(r, 500));
      }
      return { status: "timeout", error: "The install stopped making progress. Retry to run it again." };
    }

    // ── Install progress ────────────────────────────────────────────────────
    // The install task exposes weighted step snapshots (task.progress.steps)
    // emitted by the toolchain runner. Percent = completed weight share plus an
    // eased slice of the running step, so the bar keeps creeping through a long
    // npm/pip install or runtime download instead of freezing; it never reaches
    // 100% while the task is still running. Absent snapshots (test-injected
    // commands) degrade to the indeterminate spinner.
    var installView = null;

    function installPercent(steps) {
      var total = 0, done = 0, running = null;
      steps.forEach(function (s) {
        var w = s.weight > 0 ? s.weight : 1;
        total += w;
        if (s.status === "done" || s.status === "warn") done += w;
        else if (s.status === "running" && !running) running = s;
      });
      if (!total) return 0;
      var pct = done / total;
      if (running) {
        if (installView.runningId !== running.id) {
          installView.runningId = running.id;
          installView.runningSince = Date.now();
        }
        var sec = (Date.now() - installView.runningSince) / 1000;
        var w2 = running.weight > 0 ? running.weight : 1;
        pct += (w2 / total) * (1 - Math.exp(-sec / 75));
      }
      return Math.min(97, Math.round(pct * 100));
    }

    function fmtElapsed(ms) {
      var s = Math.max(0, Math.floor(ms / 1000));
      return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    }

    function renderInstallProgress(task) {
      var steps = task && task.progress && Array.isArray(task.progress.steps) ? task.progress.steps : [];
      if (!installView || !installView.mounted) {
        setActions(null);
        view.innerHTML = "";
        var wrap = el("div", {});
        wrap.appendChild(el("div", { className: "step-title" }, ["Setting up your toolchain"]));
        wrap.appendChild(el("p", { className: "step-desc" }, [
          "Traffic One is installing the tools it needs on your machine. The first run downloads a few dependencies and can take several minutes — it's safe to keep this tab open.",
        ]));
        var bar = el("div", { className: "install-bar" });
        var fill = el("div", { className: "install-fill" });
        bar.appendChild(fill);
        var pctEl = el("span", {}, ["Starting…"]);
        var elapsedEl = el("span", {}, ["0:00"]);
        wrap.appendChild(bar);
        wrap.appendChild(el("div", { className: "install-meta" }, [pctEl, elapsedEl]));
        var list = el("div", { className: "install-steps" });
        wrap.appendChild(list);
        view.appendChild(wrap);
        installView = { mounted: true, fill: fill, pct: pctEl, elapsed: elapsedEl, list: list,
          signature: null, runningId: null, runningSince: Date.now(), startedAt: Date.now() };
      }
      if (task && task.startedAt) installView.startedAt = task.startedAt;
      installView.elapsed.textContent = fmtElapsed(Date.now() - installView.startedAt);
      if (!steps.length) {
        if (installView.signature !== "spinner") {
          installView.signature = "spinner";
          installView.list.innerHTML = "";
          installView.list.appendChild(el("div", { className: "loading" }, [el("span", { className: "spinner" }), "Preparing the install…"]));
        }
        return;
      }
      var pct = installPercent(steps);
      installView.fill.style.width = pct + "%";
      installView.pct.textContent = pct + "%";
      // Rebuild the checklist only on real transitions so the running row's
      // spinner animation isn't restarted by every 500ms poll.
      var signature = JSON.stringify(steps.map(function (s) { return [s.id, s.status, s.label]; }));
      if (installView.signature !== signature) {
        installView.signature = signature;
        installView.list.innerHTML = "";
        steps.forEach(function (s) {
          var row = el("div", { className: "install-step " + s.status });
          row.appendChild(el("span", { className: "ic" }, [s.status === "done" ? "✓" : s.status === "warn" ? "!" : ""]));
          row.appendChild(el("span", {}, [s.label || s.id]));
          installView.list.appendChild(row);
        });
      }
    }

    function stepHead(v) {
      const head = el("div", { className: "step-head" });
      head.appendChild(el("div", { className: "step-title" }, [v.meta.title]));
      head.appendChild(el("p", { className: "step-desc" }, [v.meta.question]));
      return head;
    }

    // The subagent line-up shown on the team-confirmation step: each role, what it
    // does, and the model it will run on for the chosen performance level.
    function renderTeam(v) {
      const team = v.meta.team || [];
      if (!team.length) return null;
      teamSelections = {};
      teamDefaults = {};
      // The server supplies the first two exact model ids in each capability
      // tier. Every member may choose across tiers, so option identity must keep
      // both tier and model (the same model can occur in multiple rows).
      const choices = (v.meta.modelChoices || []).slice();
      const box = el("div", { className: "team" });
      const lvl = v.meta.performanceLevel ? cap(v.meta.performanceLevel) + " performance · " : "";
      const hostNote = v.meta.host ? cap(v.meta.host) + " · " : "";
      const tierNote = v.meta.recommendedTier ? " · " + cap(v.meta.recommendedTier) + " plan tier" : "";
      box.appendChild(el("div", { className: "team-head" }, [
        el("span", { className: "t" }, ["Your senior team"]),
        el("span", { className: "lvl" }, [hostNote + lvl + team.length + " agents" + tierNote]),
      ]));
      team.forEach((m) => {
        teamDefaults[m.role] = m.tier;
        const ic = el("div", { className: "ic" }, [(m.label || "?").charAt(0)]);
        const who = el("div", { className: "who" }, [
          el("div", { className: "name" }, [m.label || m.role]),
          el("div", { className: "blurb" }, [m.blurb || ""]),
        ]);
        const dot = el("span", { className: "tier-dot tier-" + (m.tier || "balanced") });
        const sel = el("select", {});
        sel.setAttribute("aria-label", (m.label || m.role) + " model");
        const list = choices.length ? choices : [{ tier: m.tier, model: m.model || m.tier, label: m.modelLabel }];
        let selectedIndex = list.findIndex((c) => c.tier === m.tier && c.model === m.model);
        if (selectedIndex < 0) selectedIndex = list.findIndex((c) => c.tier === m.tier);
        if (selectedIndex < 0) selectedIndex = 0;
        const initial = list[selectedIndex];
        teamSelections[m.role] = { tier: initial.tier, model: initial.model };
        list.forEach((c, index) => {
          // Prefer the server's friendly label ("Opus 4.8") — alias values like
          // "opus" stay the underlying selection but read ambiguously.
          const modelLabel = c.label || c.model || c.tier;
          const opt = el("option", { value: String(index) }, [c.tier + " · " + modelLabel]);
          if (index === selectedIndex) opt.selected = true;
          sel.appendChild(opt);
        });
        sel.addEventListener("change", () => {
          const selected = list[Number(sel.value)] || list[0];
          teamSelections[m.role] = { tier: selected.tier, model: selected.model };
          dot.className = "tier-dot tier-" + selected.tier;
        });
        box.appendChild(el("div", { className: "member" }, [ic, who, el("div", { className: "model" }, [dot, sel])]));
      });
      const foot = [
        "Pick a model per agent from the first two choices in each tier. Tester and Shipper default to lighter tiers to save tokens. Choose “Re-pick performance” to change the line-up size.",
      ];
      if (v.meta.host === "cursor") {
        foot.push(el("div", { className: "cursor-models-note" }, [
          "Cursor: if a model above is disabled in Settings → Models (or unavailable on your plan), Cursor silently falls back to a compatible model. Enable it (Cmd/Ctrl+Shift+J → Models) to run on exactly these models.",
        ]));
      }
      box.appendChild(el("div", { className: "team-foot" }, foot));
      return box;
    }

    function performanceRepickText(v) {
      const host = v.meta.host ? cap(v.meta.host) : "This host";
      const plan = v.meta.plan ? cap(v.meta.plan) : "current";
      switch (v.meta.repickReason) {
        case "plan-changed":
          return "Your " + host + " plan changed"
            + (v.meta.previousPlan ? " from " + cap(v.meta.previousPlan) : "")
            + " to " + plan + ". Review Performance for the new plan.";
        case "models-changed":
          return "The models used by " + host + " changed. Review Performance before the next build.";
        case "configuration-required":
          return "Confirm Performance for the current " + host + " model catalog.";
        case "team-settings-changed":
          return "The saved team no longer matches this Performance choice. Pick Performance again to rebuild the line-up.";
        default:
          return "";
      }
    }

    function renderPerformanceRepickNote(v) {
      if (v.step !== "performance") return null;
      const reason = performanceRepickText(v);
      return reason ? el("div", { className: "repick-note" }, [reason]) : null;
    }

    // Map a clicked option to the value posted to /answer. Most steps send the bare
    // option id; the team step sends both the selected tier overrides and the
    // complete exact model map so duplicate model ids across tiers stay distinct.
    function teamAnswerValue(v, id) {
      if (v.step !== "team-confirmation") return id;
      if (id !== "approve") return { action: id };
      const overrides = {};
      const modelSelections = {};
      Object.keys(teamSelections).forEach((role) => {
        const selected = teamSelections[role];
        modelSelections[role] = selected.model;
        if (selected.tier !== teamDefaults[role]) overrides[role] = selected.tier;
      });
      return { action: "approve", overrides, modelSelections };
    }

    function renderSingleSelect(v) {
      view.innerHTML = "";
      view.appendChild(stepHead(v));
      const repickNote = renderPerformanceRepickNote(v);
      if (repickNote) view.appendChild(repickNote);
      const team = renderTeam(v);
      if (team) view.appendChild(team);
      const opts = el("div", { className: "opts" });
      (v.meta.options || []).forEach((o) => {
        const main = el("div", { className: "opt-main" }, [el("div", { className: "label" }, [o.label])]);
        if (o.hint) main.appendChild(el("div", { className: "hint" }, [o.hint]));
        const btn = el("button", { className: "opt", type: "button" }, [main, el("span", { className: "opt-go" }, ["→"])]);
        btn.addEventListener("click", () => submitAnswer(v.step, teamAnswerValue(v, o.id)));
        opts.appendChild(btn);
      });
      view.appendChild(opts);
      setActions(actionBar(v, null));
    }

    function field(labelText, control, cls) {
      return el("label", { className: "field" + (cls ? " " + cls : "") }, [el("span", { className: "name" }, [labelText]), control]);
    }

    // The api-key step: a single text input + Continue. The key is VALIDATED against
    // the auth endpoint by the server before it is stored; a rejected/unverifiable
    // key surfaces inline here and keeps the user on this step (fail-closed). This is
    // the first step on a fresh project and the only step on an invalidated reopen.
    function renderApiKey(v) {
      view.innerHTML = "";
      view.appendChild(stepHead(v));
      const input = el("input", { type: "text", id: "f-apikey", placeholder: "Paste your Traffic One API key", autocomplete: "off", spellcheck: false });
      view.appendChild(field("API key", input, "lead"));
      const errBox = el("div", { className: "err" });
      view.appendChild(errBox);
      const submit = el("button", { className: "btn", type: "button" }, ["Continue"]);
      async function go() {
        const key = input.value.trim();
        if (!key) { errBox.textContent = "Enter your API key to continue."; return; }
        errBox.textContent = "";
        submit.disabled = true;
        submit.textContent = "Verifying…";
        let resp;
        try {
          resp = await api("/answer", { method: "POST", body: JSON.stringify({ step: "api-key", value: { apiKey: key } }) });
        } catch (err) {
          submit.disabled = false;
          submit.textContent = "Continue";
          errBox.textContent = err.message || "Couldn't verify the key. Try again.";
          return;
        }
        render(resp.view);
      }
      submit.addEventListener("click", go);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); go(); } });
      setActions(actionBar(v, submit));
      setTimeout(() => { try { input.focus(); } catch (_) { /* focus best-effort */ } }, 0);
    }

    function normalizeFields(raw) {
      // Tolerate both the rich {key,label,hint} shape and a bare key string.
      return (raw || []).map((f) => (typeof f === "string"
        ? { key: f, label: f, hint: "" }
        : { key: f.key, label: f.label || f.key, hint: f.hint || "" }));
    }

    function renderForm(v) {
      view.innerHTML = "";
      const head = stepHead(v);
      head.querySelector(".step-title").appendChild(el("span", { className: "pill" }, ["all optional"]));
      view.appendChild(head);
      const domainQ = v.meta.domainQuestions || [];
      if (domainQ.length) {
        const det = el("details", { className: "ctx" });
        det.appendChild(el("summary", { className: "ctx-sum" }, [
          "Context I picked up from your request",
          el("span", { className: "ctx-count" }, [String(domainQ.length)]),
        ]));
        domainQ.forEach((q) => det.appendChild(el("div", { className: "domain" }, [q])));
        view.appendChild(det);
      }

      const summary = el("input", { type: "text", id: "f-summary", placeholder: "One line: what are you building?" });
      view.appendChild(field("Summary", summary, "lead"));

      const fields = normalizeFields(v.meta.fields);
      const byKey = {};
      fields.forEach((f) => { byKey[f.key] = f; });
      const inputs = {};
      const used = {};
      function fieldNode(f) {
        const box = el("textarea", { id: "f-" + f.key, rows: 2, placeholder: f.hint });
        inputs[f.key] = box;
        used[f.key] = true;
        return field(f.label, box);
      }
      function section(cap, items) {
        if (!items.length) return;
        const sec = el("section", { className: "group" }, [el("div", { className: "group-cap" }, [cap])]);
        const grid = el("div", { className: "grid" });
        items.forEach((f) => grid.appendChild(fieldNode(f)));
        sec.appendChild(grid);
        view.appendChild(sec);
      }
      FIELD_GROUPS.forEach((g) => section(g.cap, g.keys.map((k) => byKey[k]).filter(Boolean)));
      section("More details", fields.filter((f) => !used[f.key]));

      const submit = el("button", { className: "btn", type: "button" }, ["Continue"]);
      submit.addEventListener("click", () => {
        const answers = {};
        Object.keys(inputs).forEach((k) => { const val = inputs[k].value.trim(); if (val) answers[k] = val; });
        submitAnswer("project-context", { summary: summary.value.trim(), answers });
      });
      setActions(actionBar(v, submit));
    }

    // Required-tool install failed/timed out: pause setup here. We deliberately
    // do NOT render the done state or POST /complete, so the gate stays closed
    // until the user retries (or switches the graph provider) successfully.
    function renderInstallBlocked(step, value, task) {
      view.innerHTML = "";
      view.appendChild(el("div", { className: "step-title" }, ["Couldn't install a required tool"]));
      view.appendChild(el("p", { className: "step-desc" }, [
        "Traffic One installs the code-graph tool before finishing setup, and that didn't complete. Setup is paused — nothing was marked complete.",
      ]));
      showError((task && task.error) ? task.error : "The install failed or timed out.");
      if (step === "code-graph" && (value === "graphify" || value === "gitnexus")) {
        const other = value === "graphify" ? "gitnexus" : "graphify";
        const alt = el("button", { className: "opt", type: "button" }, [
          el("div", { className: "opt-main" }, [
            el("div", { className: "label" }, ["Use " + other + " instead"]),
            el("div", { className: "hint" }, [other === "graphify" ? "Python CLI" : "Node CLI"]),
          ]),
          el("span", { className: "opt-go" }, ["→"]),
        ]);
        alt.addEventListener("click", () => submitAnswer("code-graph", other, "Switching provider…"));
        view.appendChild(alt);
      }
      const retry = el("button", { className: "btn", type: "button" }, ["Retry install"]);
      retry.addEventListener("click", () => submitAnswer(step, value, "Retrying install…"));
      setActions(el("div", { className: "bar-row" }, [el("div", {}), retry]));
    }

    // The done view kicks no install task (e.g. a reopened/already-complete
    // wizard), so verify the required toolchain is actually present first; if the
    // graph provider is missing, re-run the gated install before completing.
    async function verifyThenDone() {
      showLoading("Checking your toolchain…");
      let probe = null;
      try { probe = await api("/verify-toolchain"); }
      catch (err) {
        if (err && err.serverGone) return renderServerLost();
        probe = null;
      }
      if (probe && probe.graphMissing && probe.provider) {
        return submitAnswer("code-graph", probe.provider, "Installing required tools…");
      }
      renderDone();
    }

    async function renderDone() {
      if (completionStarted) return;
      completionStarted = true;
      showLoading("Finishing setup…");
      try {
        const completed = await api("/complete", { method: "POST", body: "{}" });
        if (!completed || completed.ok !== true) throw new Error("Setup completion was not acknowledged.");
      } catch (err) {
        // The build is NOT blocked by this: every answer was persisted as it was
        // submitted and the editor waiter re-derives completion from that state.
        // Only the tab-close acknowledgement to the setup server failed.
        completionStarted = false;
        setActions(null);
        view.innerHTML = "";
        view.appendChild(el("div", { className: "done-state" }, [
          el("div", { className: "check" }, ["✓"]),
          el("div", { className: "step-title" }, ["Setup saved — your editor is unblocked"]),
          el("p", { className: "step-desc" }, [
            "Your answers are saved and development continues in the editor. This tab couldn't send its close signal to the setup server — close it manually, or retry.",
          ]),
        ]));
        if (!(err && err.serverGone)) {
          const retry = el("button", { className: "btn", type: "button" }, ["Retry close signal"]);
          retry.addEventListener("click", () => renderDone());
          setActions(el("div", { className: "bar-row" }, [el("div", {}), retry]));
        }
        return;
      }

      setActions(null);
      view.innerHTML = "";
      const closeHint = el("p", { className: "hint" }, ["Closing this tab…"]);
      view.appendChild(el("div", { className: "done-state" }, [
        el("div", { className: "check" }, ["✓"]),
        el("div", { className: "step-title" }, ["Setup complete"]),
        el("p", { className: "step-desc" }, ["Traffic One is configured and the build has been released in your editor."]),
        closeHint,
      ]));
      // Preserve the page-level auto-close for hosts that expose it. Cursor's
      // editor tab is closed by the same agent turn via its browser_tabs tool as
      // soon as the acknowledged /complete call releases the setup waiter.
      setTimeout(() => { try { window.close(); } catch (_) { /* host closes it */ } }, 1500);
    }

    function render(v) {
      if (!v) { setActions(null); return showError("No response from the setup server."); }
      if (v.error) { setActions(null); view.innerHTML = ""; view.appendChild(el("div", { className: "step-title" }, ["Setup error"])); return showError(v.error); }
      if (v.done) return verifyThenDone();
      if (v.step === "finalize") return submitAnswer("finalize", null, "Finishing setup…");
      if (v.meta && v.meta.kind === "waiting") return renderWaiting(v);
      if (v.meta && v.meta.kind === "text_input") return renderApiKey(v);
      if (v.meta && v.meta.kind === "form") return renderForm(v);
      return renderSingleSelect(v);
    }

    // Passive step: the coding AGENT is the actor (tech classification); the page
    // just shows progress and re-polls /state until the step moves on. Guarded so
    // overlapping renders never stack two poll loops.
    var waitingPollActive = false;
    function renderWaiting(v) {
      setActions(null);
      view.innerHTML = "";
      view.appendChild(el("div", { className: "step-title" }, [v.meta && v.meta.title ? v.meta.title : "Working…"]));
      view.appendChild(el("div", { className: "step-question" }, [v.meta && v.meta.question ? v.meta.question : ""]));
      view.appendChild(el("div", { className: "hint" }, ["Waiting for your coding agent…"]));
      renderProgress(v);
      if (waitingPollActive) return;
      waitingPollActive = true;
      (async function waitLoop() {
        try {
          for (;;) {
            await new Promise((r) => setTimeout(r, 2000));
            let next;
            try { next = await api("/state"); } catch (_) { continue; }
            if (!next || (next.step === "tech-detect" && !next.done)) continue;
            waitingPollActive = false;
            return render(next);
          }
        } catch (_) {
          waitingPollActive = false;
        }
      })();
    }

    (async function start() {
      try { render(await api("/state")); }
      catch (err) {
        if (err && err.serverGone) return renderServerLost();
        setActions(null); view.innerHTML = ""; view.appendChild(el("div", { className: "step-title" }, ["Connection issue"])); showError(err.message);
      }
    })();
  </script>
</body>
</html>
